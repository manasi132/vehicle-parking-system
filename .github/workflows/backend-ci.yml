name: VPS backend CI

on:
  pull_request:
    branches:
      - main
      - feat/manasi-sprint1-auth-lot-management
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - feat/manavi-sprint1-booking-tracking
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests and syntax checks
    runs-on: ubuntu-24.04

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: find backend/src backend/tests -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run backend test suite
        working-directory: backend
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/vps_test
        run: npm test
