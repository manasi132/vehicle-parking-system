name: VPS backend CI

on:
  pull_request:
    branches:
      - main
      - feat/manasi-sprint1-auth-lot-management
      - feat/manasi-sprint2-acceptance-hardening
    paths:
      - 'backend/**'
      - 'src/payment/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - feat/manavi-sprint1-booking-tracking
      - feat/manavi-sprint2-booking-tracking
      - fix/audit-atomicity-booking-lock-fencing
    paths:
      - 'backend/**'
      - 'src/payment/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests, syntax and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --replSet rs0
          --health-cmd "mongosh --quiet --eval 'try { if (rs.status().myState === 1) quit(0); quit(1); } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"localhost:27017\"}]}); quit(1); }'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: find backend/src backend/tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run backend tests with line and branch coverage
        working-directory: backend
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/vps_test?replicaSet=rs0
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=html --coverageReporters=lcov --coverageReporters=json-summary --collectCoverageFrom='src/**/*.js'
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vps-backend-coverage
          path: backend/coverage/
          if-no-files-found: warn
          retention-days: 30
