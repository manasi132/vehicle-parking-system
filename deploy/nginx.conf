# Place in nginx's http context. Replace the hostname and certificate paths.
server {
    listen 80;
    listen [::]:80;
    server_name parking.example.com;
    return 308 https://parking.example.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name parking.example.com;
    ssl_certificate /etc/letsencrypt/live/parking.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parking.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 4k;
    # Do not write request URLs/headers/bodies to payment access logs.
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
